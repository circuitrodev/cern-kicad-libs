name: Deploy preview site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "_site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # Called by sync-upstream.yml: a push made with GITHUB_TOKEN does not start
  # another workflow, so the sync has to invoke the deploy itself.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
