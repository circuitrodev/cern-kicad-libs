name: Sync with upstream

# The upstream project regenerates the libraries from CERN's Altium sources
# every night, so this mirror checks for new content daily, rebuilds the preview
# site from it, and commits both together. Only upstream-owned files are synced;
# README.md, _site/, scripts/ and .github/ belong to the mirror.

on:
  schedule:
    - cron: "30 5 * * *" # daily, shortly after upstream's nightly conversion
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch or commit to sync to"
        default: "master"
        required: false
      rebuild_site:
        description: "Rebuild the preview site even if upstream did not move"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync library files from upstream
        id: sync
        run: |
          python3 scripts/sync-upstream.py --ref "${{ inputs.ref || 'master' }}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the tree is byte-identical to upstream
        run: python3 scripts/sync-upstream.py --ref "${{ inputs.ref || 'master' }}" --verify

      # Only when the libraries actually moved: rebuilding otherwise would
      # change nothing but the index's timestamp, producing an empty commit and
      # a redeploy of the ~256 MB site every day.
      - name: Rebuild preview site
        if: steps.sync.outputs.changed == 'true' || inputs.rebuild_site
        run: python3 scripts/build-site.py

      - name: Commit
        id: commit
        if: steps.sync.outputs.changed == 'true' || inputs.rebuild_site
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          commit=$(python3 -c "import json;print(json.load(open('mirror-state.json'))['upstream_commit'][:8])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            git commit -m "chore: sync libraries with upstream ${commit} and rebuild site"
          else
            git commit -m "chore: rebuild preview site"
          fi
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the site matches the libraries
        run: |
          libs=$(python3 -c "import json;print(json.load(open('mirror-state.json'))['upstream_committed'][:10])")
          site=$(python3 -c "import json;print(json.load(open('_site/index.json'))['generated'][:10])")
          if [ "$libs" != "$site" ]; then
            echo "::notice::Library data is from $libs but the preview site was generated on $site — run scripts/build-site.py."
          fi

  # The commit above was pushed with GITHUB_TOKEN, which deliberately does not
  # trigger the push-driven deploy workflow, so publish the new site from here.
  deploy:
    needs: sync
    if: needs.sync.outputs.committed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
